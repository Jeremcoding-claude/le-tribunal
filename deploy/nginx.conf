# nginx : à placer dans un bloc server { listen 443 ssl; ... } avec vos certificats.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Flux SSE (salle d'audience) : pas de tampon, lecture longue (un procès réel dure plusieurs minutes).
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}
